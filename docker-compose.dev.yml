# Geliştirme: yalnızca veritabanı ve nesne deposu. api ve client yerelde çalışır (`pnpm dev`).
# Başlat: pnpm db:up   ·   Durdur: pnpm db:down
name: prime-ofis-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prime
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: docker
      dockerfile: minio.Dockerfile
    # Yerelde eski resmi imaj varsa: MINIO_IMAGE=minio/minio:latest pnpm db:up
    image: ${MINIO_IMAGE:-prime-ofis/minio:RELEASE.2025-10-15T17-29-55Z}
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      MINIO_ROOT_USER: prime
      MINIO_ROOT_PASSWORD: prime-minio-dev
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata-dev:/data

volumes:
  pgdata-dev:
  miniodata-dev:
