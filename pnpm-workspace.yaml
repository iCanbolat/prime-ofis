packages:
  - apps/*
  - packages/*

# pnpm 10: yalnızca listelenen paketlerin kurulum script'leri çalışır
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
ignoredBuiltDependencies:
  # testcontainers'ın isteğe bağlı yerel hızlandırıcıları; gerekmez
  - cpu-features
  - ssh2
  - protobufjs
# @fastify/cookie tipleri `declare module "fastify"` ile genişletir ama fastify'ı bağımlılık
# olarak bildirmez; peer olarak eklenmezse genişletme api'nin fastify kopyasına ulaşmaz
packageExtensions:
  "@fastify/cookie":
    peerDependencies:
      fastify: "^5.0.0"
