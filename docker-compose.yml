# Üretim: 2 çekirdek / 4 GB VPS. Değerler kökteki .env'den okunur (bkz. .env.example).
#   docker compose up -d --build        (ilk kurulum / yerel deneme)
#   docker compose pull && docker compose up -d   (CI'da üretilen imajlarla, Faz 13)
name: prime-ofis

x-ortak: &ortak
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-api-ortam: &api-ortam
  NODE_ENV: production
  TZ: Europe/Istanbul
  DATABASE_URL: postgres://prime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/prime
  NODE_OPTIONS: --max-old-space-size=640

services:
  client:
    <<: *ortak
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    image: ${IMAGE_PREFIX:-prime-ofis}/client:${IMAGE_TAG:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TZ: Europe/Istanbul
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

  api:
    <<: *ortak
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${IMAGE_PREFIX:-prime-ofis}/api:${IMAGE_TAG:-latest}
    environment:
      <<: *api-ortam
      APP_URL: ${APP_URL:-https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      S3_BUCKET: ${S3_BUCKET:-prime-ofis}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY gerekli (openssl rand -base64 32)}
      SESSION_TTL_SAAT: ${SESSION_TTL_SAAT:-12}
      JOB_WORKERS: "true"
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 1g

  # Tek seferlik: SQL migration'larını uygular, sonra çıkar
  migrate:
    image: ${IMAGE_PREFIX:-prime-ofis}/api:${IMAGE_TAG:-latest}
    pull_policy: never
    command: ["node", "dist/db/migrate.js"]
    environment: *api-ortam
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    <<: *ortak
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - timezone=Europe/Istanbul
    environment:
      POSTGRES_DB: prime
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128m
    mem_limit: 1g

  minio:
    <<: *ortak
    build:
      context: docker
      dockerfile: minio.Dockerfile
    image: ${IMAGE_PREFIX:-prime-ofis}/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER gerekli}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      # Sunucu tarafı şifreleme (SSE-S3) için statik anahtar: "prime-anahtar:<base64 32 bayt>"
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      TZ: Europe/Istanbul
    # Konsol yalnızca sunucunun kendisinden (SSH tüneli ile) erişilebilir
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    mem_limit: 512m

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
