# 2 çekirdek / 4 GB VPS için (db mem_limit 1g). Değerler docker-compose'da -c ile verilir;
# bu dosya referans ve elle ayar içindir.
listen_addresses = '*'
max_connections = 40
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
timezone = 'Europe/Istanbul'
log_timezone = 'Europe/Istanbul'
